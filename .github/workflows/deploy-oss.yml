name: Deploy to Alibaba Cloud OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-oss-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure temporary Alibaba Cloud credentials
        id: aliyun-credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: acs:ram::1698216625456068:role/github-actions-oss-deployer
          oidc-provider-arn: acs:ram::1698216625456068:oidc-provider/github-actions
          role-session-name: github-actions-oss-deploy
          role-session-expiration: 1800
          audience: github-actions

      - name: Install ossutil
        env:
          OSSUTIL_VERSION: 2.3.0
          OSSUTIL_SHA256: 3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a
        run: |
          archive="$RUNNER_TEMP/ossutil.zip"
          install_dir="$RUNNER_TEMP/ossutil"
          curl --fail --silent --show-error --location \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip" \
            --output "$archive"
          echo "${OSSUTIL_SHA256}  ${archive}" | sha256sum --check -
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil"
          echo "$install_dir/ossutil-${OSSUTIL_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Sync website to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-id }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.aliyun-credentials.outputs.aliyun-access-key-secret }}
          OSS_SESSION_TOKEN: ${{ steps.aliyun-credentials.outputs.aliyun-security-token }}
          OSS_REGION: cn-chengdu
          OSS_ENDPOINT: https://oss-cn-chengdu.aliyuncs.com
        run: ossutil sync dist/ oss://cqy-static-site-20260816/ --delete

      - name: Verify public website files
        run: |
          curl --fail --silent --show-error --head \
            https://cqy-static-site-20260816.oss-cn-chengdu.aliyuncs.com/index.html
          curl --fail --silent --show-error --head \
            https://cqy-static-site-20260816.oss-cn-chengdu.aliyuncs.com/videos/lab-intro.mp4
