<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 726" role="img" aria-labelledby="metmekTitle metmekDesc">
  <title id="metmekTitle">MetMek</title>
  <desc id="metmekDesc">Yunnan Key Laboratory of Meteorological Disasters and Climate Resources in the Greater Mekong Subregion</desc>
  <defs>
